# Moteur SEO : un article par jour ouvré, rédigé par Claude à partir de la file
# scripts/seo-engine/articles-queue.json. Voir scripts/seo-engine/README.md.
name: SEO · article du jour

on:
  schedule:
    # 8 h 17 à Paris (heure d'été), du lundi au vendredi. GitHub ne garantit pas l'horaire :
    # seo-garde-article.yml alerte #seo si rien n'est parti à 10 h.
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug précis à rédiger (vide = premier article pending)"
        required: false
      dry:
        description: "Essai : rédiger sans publier"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seo-article-du-jour
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rédiger et contrôler
        id: run
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUG_DEMANDE: ${{ inputs.slug }}
          DRY: ${{ inputs.dry }}
        run: |
          set -o pipefail
          args=()
          [ -n "$SLUG_DEMANDE" ] && args+=(--slug "$SLUG_DEMANDE")
          [ "$DRY" = "true" ] && args+=(--dry --out "$RUNNER_TEMP/essai")
          node scripts/seo-engine/publish-article.mjs "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/run.log"

      - name: Garder l'essai
        if: inputs.dry
        uses: actions/upload-artifact@v4
        with:
          name: essai-article
          path: ${{ runner.temp }}/essai

      # Relecture par les agents (relecteur → correcteur → contre-relecture), puis mise en ligne directe quel que
      # soit le verdict ; seuls les contrôles du moteur peuvent la bloquer. Si la boucle plante, l'article part tel quel.
      - name: Relire avec les agents
        id: relire
        if: steps.run.outputs.slug != '' && steps.run.outputs.review == 'true' && !inputs.dry
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUG: ${{ steps.run.outputs.slug }}
        run: |
          set -o pipefail
          if node scripts/seo-engine/relire-article.mjs --slug "$SLUG" --verdict "$RUNNER_TEMP/verdict.md" 2>&1 | tee "$RUNNER_TEMP/relecture.log"; then
            :
          else
            echo "verdict=humain" >> "$GITHUB_OUTPUT"
            printf '## Boucle relecture → correction → verdict : 🟡 Décision humaine\n\nLa boucle automatique a échoué (voir les logs du run) : article non relu par les agents.\n' > "$RUNNER_TEMP/verdict.md"
          fi

      - name: Publier
        id: ship
        if: steps.run.outputs.slug != '' && !inputs.dry
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.run.outputs.slug }}
          TITLE: ${{ steps.run.outputs.title }}
          REVIEW: ${{ steps.run.outputs.review }}
          VERDICT: ${{ steps.relire.outputs.verdict || 'humain' }}
          VERDICT_MD: ${{ runner.temp }}/verdict.md
        run: bash scripts/seo-engine/ship.sh

      - name: Prévenir sur Slack (article non publié)
        if: steps.ship.outputs.pr != '' && !inputs.dry
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CANAL_SEO: ${{ secrets.SLACK_CANAL_SEO }}
          TITLE: ${{ steps.run.outputs.title }}
          URL: ${{ steps.run.outputs.url }}
          PR: ${{ steps.ship.outputs.pr }}
          SLUG: ${{ steps.run.outputs.slug }}
          COUT: ${{ steps.run.outputs.cout }}
        run: node scripts/seo-engine/notify.mjs ok

      - name: Alerter sur Slack
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CANAL_SEO: ${{ secrets.SLACK_CANAL_SEO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/seo-engine/notify.mjs erreur
