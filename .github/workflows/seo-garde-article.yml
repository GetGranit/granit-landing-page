# Garde-fou du moteur SEO : à 10 h (Paris, heure d'été) les jours ouvrés, vérifie que
# « SEO · article du jour » a tourné aujourd'hui. Sinon, une ligne dans #seo.
# GitHub peut retarder ou sauter un lancement planifié sans rien signaler.
name: SEO · garde de l'article du jour

on:
  schedule:
    - cron: "7 8 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: L'article du jour a-t-il tourné ?
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CANAL_SEO: ${{ secrets.SLACK_CANAL_SEO }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/seo-article-du-jour.yml
        run: |
          set -euo pipefail
          aujourdhui=$(date -u +%Y-%m-%d)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w seo-article-du-jour.yml --created ">=$aujourdhui" \
                --json event -q '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")] | length')
          echo "Exécutions aujourd'hui : $n"
          [ "$n" -gt 0 ] && exit 0
          [ -z "${SLACK_BOT_TOKEN:-}" ] && { echo "Slack non configuré"; exit 1; }
          texte="⏰ L'article du jour n'est pas parti (GitHub n'a pas lancé le moteur). <$ACTIONS_URL|Le lancer à la main> : Run workflow."
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg c "$SLACK_CANAL_SEO" --arg t "$texte" '{channel:$c,text:$t,unfurl_links:false}')" \
            | jq -e '.ok' >/dev/null
